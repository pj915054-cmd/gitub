name: Baisc CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/steup-python@v5
        with:
          "3.12"

      - name: install
        uses: pip install pytest

      - name: Run test
        uses: pytest
